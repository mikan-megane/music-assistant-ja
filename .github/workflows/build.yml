name: build

on:
  push:
    branches: [main]
    paths:
      - ja.json
      - server_ja.json
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for the published image (default: latest)"
        required: false
        default: "latest"
  schedule:
    # Daily: follow the upstream `beta` channel. Native arm64 runner keeps this
    # fast (~4 min) — the old weekly QEMU multi-arch run was cancelled at the
    # 6 h job limit (see run 41439882133).
    - cron: "0 4 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Free native arm64 runner for public repos — no QEMU emulation needed.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: img
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          # The frontend is cloned from a moving ref (`main`), so bust its
          # cache daily — otherwise BuildKit would keep the stale clone forever.
          echo "bust=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.img.outputs.tag }}
            type=raw,value=beta
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MA_SERVER_TAG=beta
            FRONTEND_CLONE_BUST=${{ steps.img.outputs.bust }}
          provenance: false
